<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Little Playground | Shahar</title>
<link rel="stylesheet" href="../editor/editor.css?v=3">
</head>
<body class="standalone">
<main class="playground" aria-label="Little playground">
    <div id="editor" aria-label="Source code"></div>
    <div class="toolbar" aria-label="Execution controls"><div class="actions"><button type="button" id="run">Run</button><button type="button" id="stop" disabled>Stop</button><button type="button" id="reset">Reset</button></div></div>
    <section class="result" aria-label="Program output">
        <header><span>Output</span><span id="status" role="status">Loading editor…</span></header>
        <pre id="output" aria-label="Output" tabindex="0"></pre>
    </section>
</main>
<aside class="customization">
    <nav aria-label="Playground navigation"><a href="/">Home</a> · <a href="/little/guides/">Guides</a> · <a href="/little/doc/">Documentation</a></nav>
    <details class="keyword-panel" open>
        <summary>Customize keywords</summary>
        <p>Blank uses the default. Update your code to use your renamed keywords.</p>
        <table id="keywords"><thead><tr><th>Usage</th><th>Keyword/Name</th><th>In Code</th></tr></thead><tbody id="k-table-body"></tbody></table>
        <button type="button" id="reset-keywords">Reset keywords</button>
    </details>
    <details class="ast-panel"><summary>Abstract Syntax Tree</summary><pre id="ast" tabindex="0" aria-label="Abstract Syntax Tree"></pre></details>
</aside>
<script type="module" src="../editor/editor.js?v=3"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"3d9e2f7ead2a4e07ad8644dfcd7ce66f"}'></script>
</body>
</html>
